<div class="pagina-login">
  <div class="tarjeta-login">
    <h1>Iniciar sesión</h1>

    <p>Ingresa tus datos para continuar</p>

    <div class="campo">
      <label>Correo</label>

      <input
        #email
        type="email"
        placeholder="user@mail.com"
      >
    </div>

    <div class="campo">
      <label>Contraseña</label>

      <input
        #password
        type="password"
        placeholder="123"
      >
    </div>

    <button
      (click)="iniciarSesion(email.value, password.value)"
    >
      Iniciar sesión
    </button>

    @if (mensaje) {
      <div class="mensaje">
        {{ mensaje }}
      </div>
    }
  </div>
</div>
