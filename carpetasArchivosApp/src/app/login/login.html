<div class="pagina">
  <div class="tarjeta">
    <h1>Mis archivos</h1>
    <p class="descripcion">Inicia sesión para continuar</p>

    <form (ngSubmit)="iniciarSesion()">
      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        type="email"
        name="correo"
        [(ngModel)]="correo"
        placeholder="correo@ejemplo.com"
        required
      >

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Ingresa tu contraseña"
        required
      >

      <button type="submit">Iniciar sesión</button>
    </form>

    @if (mensaje) {
      <p class="mensaje">{{ mensaje }}</p>
    }

    <p class="enlace">
      ¿No tienes cuenta?
      <a routerLink="/register">Regístrate</a>
    </p>
  </div>
</div>
