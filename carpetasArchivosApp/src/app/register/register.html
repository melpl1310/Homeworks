<div class="pagina">
  <div class="tarjeta">
    <h1>Crear cuenta</h1>
    <p class="descripcion">Regístrate para organizar tus archivos</p>

    <form (ngSubmit)="registrar()">
      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        type="email"
        name="correo"
        [(ngModel)]="correo"
        required
      >

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
      >

      <label for="confirmar">Confirmar contraseña</label>
      <input
        id="confirmar"
        type="password"
        name="confirmar"
        [(ngModel)]="confirmarPassword"
        required
      >

      <button type="submit">Registrarme</button>
    </form>

    @if (mensaje) {
      <p class="mensaje">{{ mensaje }}</p>
    }

    <p class="enlace">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
